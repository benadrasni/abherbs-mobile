plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace = "sk.ab.herbs"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        config {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    compileSdk 37

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "sk.ab.herbs"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    packaging {
        jniLibs {
            // AGP 9 defaults this to false (extractNativeLibs=false). ReLinker
            // 1.4.5 then fails to see libflutter.so and crashes with
            // MissingLibraryException (only found: []). ELF LOAD alignment is
            // already 16 KB, so extracting at install is 16 KB-compliant.
            useLegacyPackaging = true
        }
    }

    // Keep every ABI in the base module. A Play ABI split leaves some
    // installs with no libflutter.so where ReLinker looks.
    bundle {
        abi {
            enableSplit = false
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.config
            proguardFiles 'proguard-rules.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }
        debug {
            signingConfig signingConfigs.config
        }
    }
}

flutter {
    source '../..'
}

// Firebase / Play Ads may request a newer work-runtime. Newer than 2.9.1
// reintroduces JobScheduler.forNamespace() and the OEM startup crash.
configurations.configureEach {
    resolutionStrategy {
        force 'androidx.work:work-runtime:2.9.1'
        force 'androidx.work:work-runtime-ktx:2.9.1'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"
    // WindowCompat.setDecorFitsSystemWindows. The app already resolves core 1.18.
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "androidx.exifinterface:exifinterface:1.4.1"
    // AdMob still asks for WorkManager 2.7 (Room 2.2 / sqlite 2.1 crash on 16 KB
    // devices). 2.10+ calls JobScheduler.forNamespace() from InitializationProvider
    // whenever SDK_INT >= 34. That method is missing on some OEM Android 14
    // frameworks and kills the process before Application.onCreate. 2.9.1 is the
    // last release without namespaces and still ships Room 2.5 / sqlite 2.3.
    implementation 'androidx.work:work-runtime:2.9.1'
}

