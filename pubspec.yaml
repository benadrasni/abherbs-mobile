name: abherbs_flutter
description: Flutter version of abherbs

version: 9.1.2+912

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.6
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  firebase_analytics: 12.6.0
  firebase_auth: 6.7.0
  firebase_storage: 13.6.0
  firebase_database: 12.6.0
  firebase_remote_config: 6.7.0
  firebase_crashlytics: 5.4.0
  firebase_performance: 0.11.6
  firebase_app_check: 0.4.8
  cloud_functions: 6.5.0
  google_mobile_ads: 9.1.0
  gma_mediation_meta: 1.7.1
  google_sign_in: 7.2.0
  sign_in_with_apple: 8.2.0
  in_app_purchase: 3.3.1
  in_app_review: 2.0.12
  in_app_update: 5.0.0
  cached_network_image: 4.0.4
  url_launcher: 6.3.3
  url_launcher_ios: 6.4.2
  share_plus: 13.3.1
  app_links: 7.2.2
  fluttertoast: 10.0.0
  diacritic: 0.1.6
  path_provider: 2.1.6
  package_info_plus: 10.2.2
  image_picker: 1.2.4
  camera: 0.12.1
  exif: 3.3.0
  permission_handler: 13.0.2
  geolocator: 14.1.1
  geocoding: 5.0.0
  connectivity_plus: 7.3.1
  crypto: 3.0.7
  photo_view: 0.15.0
  youtube_player_iframe: 6.0.2
  app_tracking_transparency: 2.0.7
  country_picker: 2.0.28
  country_icons: 3.0.0
  wakelock_plus: 1.8.0
  intl_utils: 2.8.17
  image: 4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

  fonts:
    - family: Source Sans 3
      fonts:
        - asset: fonts/SourceSans3.ttf
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces.ttf
        - asset: fonts/Fraunces-Italic.ttf
          style: italic

  assets:
    - res/images/

flutter_intl:
  enabled: true